<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboCamp 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="display-page">

  <!-- ── Header ── -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="header-icon">⚙</div>
        <div>
          <div class="header-title">RoboCamp 2026</div>
        </div>
      </div>
      <a href="/schedule.html" class="btn btn-ghost">📅 Schedule</a>
    </div>
  </header>

  <!-- ── Main grid ── -->
  <main class="display-grid">

    <!-- Current Match -->
    <section class="card current-match-card">
      <div class="section-label">ON THE FIELD</div>
      <div class="current-team-name" id="cur-team-name">—</div>
      <div class="current-meta">
        <div class="meta-chip">
          <span class="meta-lbl">TEAM #</span>
          <span class="meta-val" id="cur-team-num">—</span>
        </div>
        <div class="meta-chip">
          <span class="meta-lbl">MATCH</span>
          <span class="meta-val" id="cur-round">—</span>
        </div>
      </div>
    </section>

    <!-- Queue -->
    <section class="card queue-card">
      <div class="section-label">COMING UP</div>
      <ol class="queue-list" id="queue-list">
        <li class="queue-item queue-empty">No upcoming matches</li>
      </ol>
    </section>

    <!-- Scoreboard — spans full bottom row -->
    <section class="card scoreboard-card">
      <div class="section-label">SCOREBOARD</div>
      <div class="scoreboard-wrap">
        <table class="scoreboard-table" id="scoreboard-table">
          <thead>
            <tr>
              <th class="col-rank">#</th>
              <th class="col-team">Team Name</th>
              <th class="col-adj">Adjusted Score</th>
              <th class="col-total">Total Score</th>
              <th class="col-r">Match 1</th>
              <th class="col-r">Match 2</th>
              <th class="col-r">Match 3</th>
              <th class="col-r">Match 4</th>
              <th class="col-r">Match 5</th>
              <th class="col-r">Match 6</th>
            </tr>
          </thead>
          <tbody id="scoreboard-body">
            <tr><td colspan="10" class="empty-cell">Scores will appear here</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="/display.js"></script>
</body>
</html>
